<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepIndex AI - Bold Tech News for Developers</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef6ff',
                            100: '#d8eafd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                            accent: '#22d3ee',
                            yellow: '#facc15',
                            emerald: '#34d399',
                            rose: '#fb7185'
                        },
                        boldcard: '#0f172a',
                        codebg: '#020617',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans (Extra Bold) & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* Bold Neumorphic & High-Contrast Shadow Styling */
        .bold-shadow {
            box-shadow: 0 8px 0 0 #020617;
        }
        .bold-shadow-sm {
            box-shadow: 0 4px 0 0 #020617;
        }
        .bold-shadow-press:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 0 #020617;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Custom modal animation */
        @keyframes modalSlideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-modal-up {
            animation: modalSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="h-full bg-slate-950 font-sans antialiased text-slate-100 flex flex-col justify-center items-center md:py-6">

    <!-- Mobile Device Container Mockup -->
    <div class="w-full max-w-md h-full md:h-[920px] md:max-h-[96vh] bg-slate-900 md:rounded-[40px] border-0 md:border-[6px] md:border-slate-800 shadow-2xl flex flex-col overflow-hidden relative">

        <!-- Status Bar -->
        <div class="bg-slate-950 px-6 pt-3 pb-2 flex justify-between items-center text-xs text-slate-400 select-none z-20 border-b border-slate-800/60">
            <span class="font-extrabold text-slate-200 tracking-wider font-mono" id="clock">10:42</span>
            <div class="flex items-center space-x-2 text-slate-300">
                <i class="fa-solid fa-microchip text-xs text-brand-yellow"></i>
                <i class="fa-solid fa-wifi text-xs"></i>
                <i class="fa-solid fa-battery-full text-xs text-emerald-400"></i>
            </div>
        </div>

        <!-- Big & Bold Header -->
        <header class="bg-slate-950 px-4 pt-4 pb-3 sticky top-0 z-10 border-b-2 border-slate-800 space-y-3">
            <div class="flex items-center justify-between">
                <div>
                    <span class="text-[10px] font-extrabold tracking-widest text-brand-yellow uppercase bg-brand-yellow/10 border border-brand-yellow/30 px-2 py-0.5 rounded-full font-mono">
                        ⚡ Techie Micro-Learn
                    </span>
                    <h1 class="text-2xl font-black text-white tracking-tight leading-none mt-1 uppercase">
                        DEEP<span class="text-brand-500">INDEX</span> <span class="text-brand-accent">AI</span>
                    </h1>
                </div>

                <!-- Search Button -->
                <button onclick="toggleSearch()" class="w-11 h-11 rounded-2xl bg-brand-600 border-2 border-slate-950 text-white flex items-center justify-center text-base bold-shadow-sm bold-shadow-press transition">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <!-- Model Ticker -->
            <div class="bg-slate-900 border-2 border-slate-800 rounded-xl px-3 py-1.5 flex items-center space-x-3 overflow-x-auto hide-scrollbar text-xs font-mono font-bold">
                <span class="text-brand-yellow uppercase tracking-wider shrink-0 flex items-center gap-1">
                    <i class="fa-solid fa-fire text-brand-yellow"></i> ARENA:
                </span>
                <span class="shrink-0 text-slate-200">
                    DeepSeek-V3 <span class="text-emerald-400">#1 MoE (1320 ELO)</span>
                </span>
                <span class="shrink-0 text-slate-700">❚</span>
                <span class="shrink-0 text-slate-200">
                    FlashAttn-3 <span class="text-brand-accent">740 TFLOPS</span>
                </span>
            </div>

            <!-- Expandable Search Input -->
            <div id="searchBar" class="hidden">
                <div class="relative mt-1">
                    <input type="text" id="searchInput" oninput="filterNews()" placeholder="Search paper, PyTorch, vLLM, CUDA..." 
                           class="w-full bg-slate-900 border-2 border-brand-500 rounded-2xl pl-4 pr-10 py-2.5 text-sm font-bold text-white placeholder-slate-500 focus:outline-none font-mono">
                    <button onclick="toggleSearch()" class="absolute right-3 top-3 text-slate-400 hover:text-white">
                        <i class="fa-solid fa-xmark text-base"></i>
                    </button>
                </div>
            </div>

            <!-- Big Horizontal Categories Carousel -->
            <nav class="flex space-x-2 overflow-x-auto hide-scrollbar pt-1 font-extrabold text-xs tracking-wide">
                <button onclick="filterCategory('home', this)" class="category-btn active px-4 py-2 rounded-xl bg-brand-600 border-2 border-slate-950 text-white bold-shadow-sm shrink-0 uppercase transition">🏠 Home</button>
                <button onclick="filterCategory('all', this)" class="category-btn px-4 py-2 rounded-xl bg-slate-900 border-2 border-slate-800 text-slate-300 hover:text-white shrink-0 uppercase transition">⚡ Dev Feed</button>
                <button onclick="filterCategory('casestudies', this)" class="category-btn px-4 py-2 rounded-xl bg-slate-900 border-2 border-slate-800 text-slate-300 hover:text-white shrink-0 uppercase transition">🏢 Case Studies</button>
                <button onclick="filterCategory('security', this)" class="category-btn px-4 py-2 rounded-xl bg-slate-900 border-2 border-slate-800 text-slate-300 hover:text-white shrink-0 uppercase transition">🛡️ CyberSec</button>
                <button onclick="filterCategory('compliance', this)" class="category-btn px-4 py-2 rounded-xl bg-slate-900 border-2 border-slate-800 text-slate-300 hover:text-white shrink-0 uppercase transition">⚖️ Compliance</button>
                <button onclick="filterCategory('infra', this)" class="category-btn px-4 py-2 rounded-xl bg-slate-900 border-2 border-slate-800 text-slate-300 hover:text-white shrink-0 uppercase transition">🛠️ Stack & GPU</button>
                <button onclick="filterCategory('models', this)" class="category-btn px-4 py-2 rounded-xl bg-slate-900 border-2 border-slate-800 text-slate-300 hover:text-white shrink-0 uppercase transition">🔬 Models</button>
            </nav>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto px-4 py-4 space-y-5 bg-slate-950" id="feedContainer">
            <!-- Dynamic Content -->
        </main>

        <!-- Detail Modal View -->
        <div id="detailModal" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md z-40 flex flex-col justify-end">
            <div class="bg-slate-900 border-t-4 border-brand-500 rounded-t-[36px] max-h-[90%] flex flex-col overflow-hidden animate-modal-up shadow-2xl">
                <!-- Modal Top Handle Bar -->
                <div class="px-6 pt-4 pb-2 flex justify-between items-center border-b border-slate-800 bg-slate-950">
                    <span id="modalSourceBadge" class="text-xs font-black font-mono text-brand-accent uppercase tracking-wider">
                        SOURCE
                    </span>
                    <button onclick="closeDetailModal()" class="w-9 h-9 rounded-full bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center border border-slate-700">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <!-- Modal Scrollable Content -->
                <div class="p-6 overflow-y-auto space-y-5 text-slate-100" id="modalBody">
                    <!-- Dynamic Modal Injection -->
                </div>

                <!-- Modal Footer Action Bar -->
                <div class="p-4 bg-slate-950 border-t border-slate-800 flex items-center justify-between gap-3 font-mono font-bold text-xs">
                    <button id="modalSaveBtn" onclick="" class="flex-1 py-3 bg-slate-900 border-2 border-slate-800 rounded-2xl text-slate-300 hover:text-white uppercase flex items-center justify-center gap-2">
                        <i class="fa-regular fa-bookmark"></i> Save
                    </button>
                    <button id="modalShareBtn" onclick="" class="flex-1 py-3 bg-brand-600 border-2 border-slate-950 text-white rounded-2xl uppercase bold-shadow-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-share-nodes"></i> Share Markdown
                    </button>
                </div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="hidden absolute top-20 left-1/2 transform -translate-x-1/2 bg-brand-yellow text-slate-950 font-black text-xs px-5 py-3 rounded-2xl border-2 border-slate-950 bold-shadow z-50 flex items-center gap-2 uppercase tracking-wide">
            <i class="fa-solid fa-circle-check text-base"></i>
            <span id="toastMsg">Copied!</span>
        </div>

    </div>

    <!-- Script Logic -->
    <script>
        const industryNews = [
            {
                id: 101,
                title: "NVIDIA Discloses Next-Gen Ultra-Compute Chip Architecture",
                source: "ENTERPRISE AI",
                time: "1h ago",
                category: "industry",
                summary: "NVIDIA introduced new data center silicon featuring quadrupled inference throughput for trillion-parameter MoE workloads.",
                bullets: [
                    "Designed explicitly for Mixture-of-Experts (MoE) clusters.",
                    "Sub-millisecond optical interconnects across nodes.",
                    "Integrates FP4 tensor cores for aggressive inference quantization.",
                    "Targeted deployment window: Q3 2027 enterprise data centers."
                ],
                tag: "HARDWARE SOTA",
                fullAnalysis: "The new architecture represents a architectural leap specifically optimized for sparse Mixture-of-Experts models. By offloading routing logic into hardware accelerators and utilizing high-density optical interconnects, node communication overhead is reduced by up to 60%. Benchmark tests show inference costs dropping significantly for 1T+ parameter deployments."
            },
            {
                id: 102,
                title: "EU AI Act Enforcement Begins: Strict Algorithmic Audits Enforced",
                source: "LEGAL TECH",
                time: "3h ago",
                category: "compliance",
                summary: "Mandatory compliance rules take effect across Europe requiring automated transparency logs and data lineage tracking.",
                bullets: [
                    "Open-source non-commercial models retain safe-harbor status.",
                    "Hefty fines for non-compliant automated biometric scoring.",
                    "Requires cryptographic verification of training dataset origins.",
                    "Appoints national regulatory auditors across all 27 member states."
                ],
                tag: "REGULATION",
                fullAnalysis: "Enforcement teams are deploying automated vulnerability and lineage checks across commercial API providers operating in Europe. Compliance auditing requires detailed telemetry showing model weights, dataset provenance checks, and adversarial robustness benchmarks."
            }
        ];

        const newsItems = [
            {
                id: 1,
                title: "Bristol Myers Squibb Deploys Enterprise LLM Stack Across 30,000 Staff",
                source: "BIOTECH DIGEST",
                category: "casestudies",
                depth: "L2 DEEP DIVE",
                depthBg: "bg-brand-yellow text-slate-950",
                time: "1h ago",
                tldr: "Scaled autonomous AI agent workflows to 30,000 employees for clinical trial matching and regulatory drafting, slashing cycle times by 40%.",
                takeaways: [
                    "Achieved 4.2x ROI within 5 months via self-hosted on-prem nodes.",
                    "Synthesized clinical data to protect patient PII.",
                    "Automated evaluation loops prevent medical hallucinations."
                ],
                code: `# Enterprise Clinical RAG Context Sanitization & PII Masking
def sanitize_clinical_prompt(prompt_text, presidio_analyzer):
    sanitized_res = presidio_analyzer.analyze(
        text=prompt_text, 
        entities=["PERSON", "PHONE_NUMBER", "MEDICAL_RECORD"]
    )
    clean_prompt = presidio_analyzer.anonymize(text=prompt_text, analyzer_results=sanitized_res)
    return clean_prompt.text`,
                repo: { name: "bms-ai/clinical-rag", url: "https://github.com", stars: "1.2k" },
                metric: { label: "Cycle Reduction", val: "-40%" }
            },
            {
                id: 2,
                title: "LiteLLM Exploited in Global Security Incident: gVisor Sandboxing Advised",
                source: "CERT ALERT",
                category: "security",
                depth: "L3 KERNEL",
                depthBg: "bg-brand-rose text-white",
                time: "3h ago",
                tldr: "Autonomous AI agents were weaponized to exploit LiteLLM proxy setups. Security teams urge immediate isolation of agent execution environments.",
                takeaways: [
                    "AI hacking agents reduced vulnerability weaponization time to minutes.",
                    "LiteLLM patched key extraction vulnerability in v1.42+.",
                    "Isolate execution agents in gVisor or WebAssembly sandboxes."
                ],
                code: `# Sandboxed execution guardrail for LLM tool call invocation
import subprocess

def run_agent_tool_sandboxed(command_args):
    # Enforce ephemeral container sandbox with zero network access
    sandbox_cmd = ["gvisor-sandbox", "--net=none", "--mem=512M"] + command_args
    result = subprocess.run(sandbox_cmd, capture_output=True, timeout=5)
    return result.stdout.decode('utf-8')`,
                repo: { name: "vulnerability-alert/ai-sandbox", url: "https://github.com", stars: "4.8k" },
                metric: { label: "Threat Response", val: "< 60 SEC" }
            },
            {
                id: 3,
                title: "FlashAttention-3: FP8 Tensor Core Acceleration on Hopper GPUs",
                source: "RESEARCH BREAKTHROUGH",
                category: "infra",
                depth: "L3 MATH/KERNEL",
                depthBg: "bg-brand-rose text-white",
                time: "5h ago",
                tldr: "FlashAttention-3 uses asynchronous FP8 tensor core operations on NVIDIA H100s to achieve 740 TFLOPS/s—nearly double FlashAttention-2 speed.",
                takeaways: [
                    "Warp-specialization overlaps memory copies with FP8 tensor ops.",
                    "Supports sequence lengths up to 256k tokens without OOM.",
                    "Integrates directly into PyTorch via custom CUDA kernels."
                ],
                code: `import torch
from flash_attn import flash_attn_func

# FlashAttention-3 FP8 execution interface
q, k, v = get_fp8_tensors(batch=4, seqlen=65536, nheads=32, d=128)

out = flash_attn_func(
    q, k, v, 
    dropout_p=0.0, 
    softmax_scale=1.0 / (128**0.5),
    causal=True,
    fp8_mode=True
)`,
                repo: { name: "Dao-AILab/flash-attention", url: "https://github.com", stars: "14.2k" },
                metric: { label: "H100 Speed", val: "740 TFLOPS" }
            },
            {
                id: 4,
                title: "DeepSeek-V3 Architecture: Multi-Head Latent Attention (MLA) Deep Dive",
                source: "DEEPSEEK LABS",
                category: "models",
                depth: "L2 DEEP DIVE",
                depthBg: "bg-brand-yellow text-slate-950",
                time: "8h ago",
                tldr: "DeepSeek-V3 introduces Multi-Head Latent Attention (MLA) to compress KV cache footprint by 93% while running 671B parameters efficiently.",
                takeaways: [
                    "MLA projects KV cache into low-rank latent spaces.",
                    "Auxiliary-loss-free routing strategy balances expert loads.",
                    "Trained on 14.8T tokens for under $6M USD."
                ],
                code: `class MultiHeadLatentAttention(nn.Module):
    def __init__(self, d_model, n_heads, kv_compression_dim):
        super().__init__()
        self.w_dkv = nn.Linear(d_model, kv_compression_dim, bias=False)
        self.w_uk = nn.Linear(kv_compression_dim, n_heads * d_head, bias=False)

    def forward(self, x):
        c_kv = self.w_dkv(x) # [Batch, Seq, Latent_Dim]
        return self.w_uk(c_kv)`,
                repo: { name: "deepseek-ai/DeepSeek-V3", url: "https://github.com", stars: "28.5k" },
                metric: { label: "MMLU Score", val: "88.5%" }
            }
        ];

        let currentCategory = 'home';

        function renderFeed() {
            const container = document.getElementById('feedContainer');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = '';

            if (currentCategory === 'home') {
                renderHomeView(container, searchVal);
                return;
            }

            const filtered = newsItems.filter(item => {
                const matchCat = currentCategory === 'all' || item.category === currentCategory;
                const matchSearch = item.title.toLowerCase().includes(searchVal) || 
                                    item.tldr.toLowerCase().includes(searchVal);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 space-y-3 bg-slate-900 rounded-3xl border-2 border-slate-800 p-6">
                        <i class="fa-solid fa-ghost text-4xl text-brand-yellow"></i>
                        <p class="text-base font-extrabold text-slate-300 uppercase font-mono">No articles found</p>
                        <button onclick="resetFilters()" class="px-4 py-2 bg-brand-600 text-white font-extrabold text-xs rounded-xl border-2 border-slate-950 bold-shadow-sm uppercase">Clear Search</button>
                    </div>
                `;
                return;
            }

            filtered.forEach(item => {
                container.appendChild(createBoldDevCard(item));
            });
        }

        function renderHomeView(container, searchVal) {
            // Hero Card
            const hero = document.createElement('div');
            hero.className = "bg-gradient-to-br from-brand-700 to-brand-900 border-2 border-slate-950 rounded-3xl p-5 bold-shadow space-y-3 relative overflow-hidden cursor-pointer hover:border-brand-yellow transition";
            hero.innerHTML = `
                <div class="flex justify-between items-center text-xs font-black text-brand-yellow uppercase tracking-wider font-mono">
                    <span>⚡ DAILY BRIEFING</span>
                    <span>OCT 2026</span>
                </div>
                <h2 class="text-xl font-black text-white leading-tight uppercase">
                    AI ECOSYSTEM ROUNDUP: HARDWARE GAINS & COMPLIANCE RULES
                </h2>
                <p class="text-xs font-bold text-slate-200 leading-relaxed">
                    Key breakthroughs in hardware efficiency, open-weight models, and regulatory frameworks. Tap to explore.
                </p>
            `;
            hero.onclick = () => openIndustryModal(industryNews[0]);
            container.appendChild(hero);

            // Industry Section Title
            const indTitle = document.createElement('div');
            indTitle.className = "flex items-center justify-between text-xs font-black uppercase text-slate-400 tracking-wider pt-2 font-mono";
            indTitle.innerHTML = `
                <span class="flex items-center gap-2"><i class="fa-solid fa-globe text-brand-yellow"></i> Industry Overview</span>
            `;
            container.appendChild(indTitle);

            // Industry Cards
            industryNews.forEach(item => {
                const card = document.createElement('article');
                card.className = "bg-slate-900 border-2 border-slate-800 hover:border-brand-500 rounded-3xl p-5 space-y-3 bold-shadow cursor-pointer transition";
                card.onclick = () => openIndustryModal(item);
                card.innerHTML = `
                    <div class="flex items-center justify-between text-xs font-mono font-bold">
                        <span class="text-brand-accent uppercase font-black">${item.source}</span>
                        <span class="text-slate-500">${item.time}</span>
                    </div>
                    <h3 class="text-base font-black text-white leading-snug">${item.title}</h3>
                    <p class="text-xs font-medium text-slate-300 bg-slate-950 p-3 rounded-2xl border border-slate-800">${item.summary}</p>
                    <div class="flex items-center justify-between pt-1">
                        <span class="px-3 py-1 bg-brand-yellow/10 border border-brand-yellow/30 text-brand-yellow rounded-xl text-[10px] font-black uppercase font-mono">${item.tag}</span>
                        <span class="text-xs font-bold text-brand-500 uppercase flex items-center gap-1 font-mono">
                            View Details →
                        </span>
                    </div>
                `;
                container.appendChild(card);
            });

            // Developer Highlights Title
            const devTitle = document.createElement('div');
            devTitle.className = "flex items-center justify-between text-xs font-black uppercase text-slate-400 tracking-wider pt-2 font-mono";
            devTitle.innerHTML = `
                <span class="flex items-center gap-2"><i class="fa-solid fa-code text-brand-accent"></i> Technical Highlights</span>
                <button onclick="filterCategory('all', document.querySelectorAll('.category-btn')[1])" class="text-brand-500 hover:underline">View All →</button>
            `;
            container.appendChild(devTitle);

            // Display Top 2 Technical Cards
            newsItems.slice(0, 2).forEach(item => {
                container.appendChild(createBoldDevCard(item));
            });
        }

        function createBoldDevCard(item) {
            const card = document.createElement('article');
            card.className = "bg-slate-900 border-2 border-slate-800 hover:border-brand-500 rounded-3xl p-5 space-y-4 bold-shadow cursor-pointer transition";
            
            // Clicking the card frame opens the full detail modal
            card.onclick = (e) => {
                // Ignore clicks on internal interactive buttons
                if (e.target.closest('button') || e.target.closest('a')) return;
                openDevModal(item);
            };

            card.innerHTML = `
                <!-- Top Badge Row -->
                <div class="flex items-center justify-between">
                    <span class="text-xs font-black font-mono text-brand-accent uppercase tracking-wider">${item.source}</span>
                    <span class="px-3 py-1 rounded-xl text-[10px] font-black font-mono uppercase border-2 border-slate-950 ${item.depthBg}">
                        ${item.depth}
                    </span>
                </div>

                <!-- Headline -->
                <h2 class="text-lg font-black text-white leading-tight">
                    ${item.title}
                </h2>

                <!-- Big Segmented Buttons -->
                <div class="bg-slate-950 p-1.5 rounded-2xl border-2 border-slate-800 flex text-xs font-extrabold font-mono gap-1" onclick="event.stopPropagation()">
                    <button onclick="switchTab(${item.id}, 'tldr', this)" class="tab-${item.id} flex-1 py-2 rounded-xl text-center bg-brand-600 text-white uppercase bold-shadow-sm transition">Summary</button>
                    <button onclick="switchTab(${item.id}, 'points', this)" class="tab-${item.id} flex-1 py-2 rounded-xl text-center text-slate-400 hover:text-white uppercase transition">Takeaways</button>
                    <button onclick="switchTab(${item.id}, 'code', this)" class="tab-${item.id} flex-1 py-2 rounded-xl text-center text-slate-400 hover:text-white uppercase transition">Kernel</button>
                </div>

                <!-- Dynamic Content Area -->
                <div id="body-${item.id}" class="min-h-[90px] text-xs font-medium text-slate-200">
                    <div class="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 leading-relaxed">
                        ${item.tldr}
                    </div>
                </div>

                <!-- Metric Highlight Pill -->
                ${item.metric ? `
                <div class="flex items-center justify-between bg-brand-500/10 border-2 border-brand-500/30 px-3.5 py-2 rounded-2xl text-xs font-mono font-bold">
                    <span class="text-slate-300 uppercase">${item.metric.label}</span>
                    <span class="text-brand-accent font-black text-sm">${item.metric.val}</span>
                </div>
                ` : ''}

                <!-- Actions Footer -->
                <div class="flex items-center justify-between pt-1 border-t border-slate-800 text-xs font-extrabold font-mono" onclick="event.stopPropagation()">
                    <div class="flex items-center space-x-3">
                        <button onclick="toggleBookmark(this)" class="text-slate-400 hover:text-brand-yellow uppercase flex items-center gap-1">
                            <i class="fa-regular fa-bookmark"></i> Save
                        </button>
                        <button onclick="shareMarkdown(${item.id})" class="text-slate-400 hover:text-brand-accent uppercase flex items-center gap-1">
                            <i class="fa-solid fa-share-nodes"></i> Share
                        </button>
                    </div>

                    <button onclick="openDevModalById(${item.id})" class="text-brand-yellow hover:underline uppercase flex items-center gap-1">
                        Full View →
                    </button>
                </div>
            `;
            return card;
        }

        /* --- Modal Operations --- */
        function openDevModalById(id) {
            const item = newsItems.find(i => i.id === id);
            if(item) openDevModal(item);
        }

        function openDevModal(item) {
            document.getElementById('modalSourceBadge').innerText = `${item.source} • ${item.depth}`;
            const body = document.getElementById('modalBody');
            
            body.innerHTML = `
                <div class="space-y-4">
                    <span class="text-xs font-mono font-bold text-slate-400">${item.time}</span>
                    <h2 class="text-xl font-black text-white leading-tight uppercase">${item.title}</h2>
                    
                    <div class="bg-slate-950 p-4 rounded-2xl border-2 border-slate-800 space-y-2">
                        <span class="text-[10px] font-mono font-black text-brand-yellow uppercase tracking-wider">Executive Summary</span>
                        <p class="text-xs font-medium text-slate-200 leading-relaxed">${item.tldr}</p>
                    </div>

                    <div class="space-y-2">
                        <span class="text-xs font-mono font-black text-brand-accent uppercase tracking-wider">Key Takeaways</span>
                        <ul class="space-y-2 bg-slate-950 p-4 rounded-2xl border border-slate-800 text-xs font-medium">
                            ${item.takeaways.map(t => `<li class="flex items-start gap-2"><span class="text-brand-yellow font-black">▶</span> <span>${t}</span></li>`).join('')}
                        </ul>
                    </div>

                    ${item.code ? `
                    <div class="space-y-2">
                        <span class="text-xs font-mono font-black text-slate-300 uppercase tracking-wider">Code / Kernel Preview</span>
                        <div class="bg-codebg rounded-2xl border-2 border-slate-800 p-3 font-mono text-[11px] relative overflow-x-auto">
                            <div class="flex justify-between items-center pb-2 mb-2 border-b border-slate-800 text-[10px] text-slate-400 font-bold uppercase">
                                <span>CODE RUNNABLE</span>
                                <button onclick="copyCodeText(\`${item.code.replace(/`/g, '\\`')}\`)" class="text-brand-yellow hover:underline flex items-center gap-1">
                                    <i class="fa-regular fa-copy"></i> COPY
                                </button>
                            </div>
                            <pre class="text-slate-200 font-mono font-bold leading-relaxed"><code>${escapeHtml(item.code)}</code></pre>
                        </div>
                    </div>
                    ` : ''}

                    ${item.repo ? `
                    <div class="pt-2">
                        <a href="${item.repo.url}" target="_blank" class="w-full py-3 bg-slate-950 border-2 border-slate-800 text-white rounded-2xl text-xs font-mono font-bold flex items-center justify-center gap-2 hover:border-brand-500 transition">
                            <i class="fa-brands fa-github text-base text-brand-yellow"></i>
                            Open GitHub Repo (${item.repo.name} • ★ ${item.repo.stars})
                        </a>
                    </div>
                    ` : ''}
                </div>
            `;

            document.getElementById('modalShareBtn').onclick = () => shareMarkdown(item.id);
            document.getElementById('modalSaveBtn').onclick = (e) => toggleBookmark(e.target);
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function openIndustryModal(item) {
            document.getElementById('modalSourceBadge').innerText = `${item.source} • ${item.tag}`;
            const body = document.getElementById('modalBody');
            
            body.innerHTML = `
                <div class="space-y-4">
                    <span class="text-xs font-mono font-bold text-slate-400">${item.time}</span>
                    <h2 class="text-xl font-black text-white leading-tight uppercase">${item.title}</h2>
                    
                    <div class="bg-slate-950 p-4 rounded-2xl border-2 border-slate-800 space-y-2">
                        <span class="text-[10px] font-mono font-black text-brand-yellow uppercase tracking-wider">Overview</span>
                        <p class="text-xs font-medium text-slate-200 leading-relaxed">${item.summary}</p>
                    </div>

                    ${item.fullAnalysis ? `
                    <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2">
                        <span class="text-[10px] font-mono font-black text-brand-accent uppercase tracking-wider">Detailed Analysis</span>
                        <p class="text-xs font-medium text-slate-300 leading-relaxed">${item.fullAnalysis}</p>
                    </div>
                    ` : ''}

                    <div class="space-y-2">
                        <span class="text-xs font-mono font-black text-brand-accent uppercase tracking-wider">Key Bullet Points</span>
                        <ul class="space-y-2 bg-slate-950 p-4 rounded-2xl border border-slate-800 text-xs font-medium">
                            ${item.bullets.map(b => `<li class="flex items-start gap-2"><span class="text-brand-yellow font-black">▶</span> <span>${b}</span></li>`).join('')}
                        </ul>
                    </div>
                </div>
            `;

            document.getElementById('modalShareBtn').onclick = () => {
                const md = `**${item.title}** (${item.source})\n• ${item.summary}`;
                copyCodeText(md);
            };
            document.getElementById('modalSaveBtn').onclick = (e) => toggleBookmark(e.target);
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        function switchTab(itemId, tabType, btn) {
            const tabs = document.querySelectorAll(`.tab-${itemId}`);
            tabs.forEach(t => {
                t.classList.remove('bg-brand-600', 'text-white', 'bold-shadow-sm');
                t.classList.add('text-slate-400');
            });
            btn.classList.add('bg-brand-600', 'text-white', 'bold-shadow-sm');
            btn.classList.remove('text-slate-400');

            const body = document.getElementById(`body-${itemId}`);
            const item = newsItems.find(i => i.id === itemId);

            if (tabType === 'tldr') {
                body.innerHTML = `
                    <div class="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 leading-relaxed font-medium">
                        ${item.tldr}
                    </div>
                `;
            } else if (tabType === 'points') {
                body.innerHTML = `
                    <ul class="space-y-2 bg-slate-950 p-3.5 rounded-2xl border border-slate-800 text-xs font-medium">
                        ${item.takeaways.map(t => `<li class="flex items-start gap-2"><span class="text-brand-yellow font-black">▶</span> <span>${t}</span></li>`).join('')}
                    </ul>
                `;
            } else if (tabType === 'code') {
                body.innerHTML = `
                    <div class="bg-codebg rounded-2xl border-2 border-slate-800 p-3 font-mono text-[11px] relative overflow-x-auto">
                        <div class="flex justify-between items-center pb-2 mb-2 border-b border-slate-800 text-[10px] text-slate-400 font-bold uppercase">
                            <span>PYTHON / CUDA KERNEL</span>
                            <button onclick="copyCode(this)" class="text-brand-yellow hover:underline flex items-center gap-1">
                                <i class="fa-regular fa-copy"></i> COPY
                            </button>
                        </div>
                        <pre class="text-slate-200 font-mono font-bold leading-relaxed"><code>${escapeHtml(item.code)}</code></pre>
                    </div>
                `;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(b => {
                b.classList.remove('bg-brand-600', 'text-white', 'bold-shadow-sm');
                b.classList.add('bg-slate-900', 'text-slate-300');
            });
            if (btn) {
                btn.classList.add('bg-brand-600', 'text-white', 'bold-shadow-sm');
                btn.classList.remove('bg-slate-900', 'text-slate-300');
            }
            renderFeed();
        }

        function toggleSearch() {
            const sb = document.getElementById('searchBar');
            sb.classList.toggle('hidden');
            if(!sb.classList.contains('hidden')) {
                document.getElementById('searchInput').focus();
            }
        }

        function filterNews() {
            renderFeed();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            renderFeed();
        }

        function shareMarkdown(itemId) {
            const item = newsItems.find(i => i.id === itemId);
            if (!item) return;

            const md = `**${item.title}** (${item.source})\n• ${item.tldr}\n${item.repo ? `• Repo: ${item.repo.url}` : ''}`;
            copyCodeText(md, "Copied Markdown for Slack!");
        }

        function copyCodeText(text, msg = "Copied to clipboard!") {
            const dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = text;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);

            showToast(msg);
        }

        function copyCode(btn) {
            showToast("Code copied!");
        }

        function toggleBookmark(btn) {
            showToast("Saved to queue");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2000);
        }

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${h}:${m}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        renderFeed();
    </script>
</body>
</html>
