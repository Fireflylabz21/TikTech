name: TikTech Ingestion Cron

on:
  schedule:
    - cron: '0 */3 * * *'  # Every 3 hours
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow GitHub Actions to commit feed_latest.json back to repository
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pydantic psycopg2-binary

      - name: Run Ingestion Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || vars.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN || vars.HF_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || vars.NEON_DATABASE_URL }}
        run: |
          python autonomous_ingestion_pipeline_agent.py

      - name: Commit & Push feed_latest.json
        run: |
          git config --global user.name "TikTech Ingestion Bot"
          git config --global user.email "bot@tiktech.ai"
          git add feed_latest.json
          git diff --staged --quiet || git commit -m "chore: auto-update latest technical feed [skip ci]"
          git push
